name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    # Windows like the players' machines: the app and its tests use user32, kernel32 and winreg.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The tests read maalc's tests/screens; .github/maalc-commit pins the commit (one line to change).
      - name: Read the pinned maalc commit
        id: pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < .github/maalc-commit)" >> "$GITHUB_OUTPUT"

      # Only the screens: the game data, templates and icons come from the resource package (tools/fetch_resource.py).
      - uses: actions/checkout@v4
        with:
          repository: EnderWolf50/maalc
          ref: ${{ steps.pin.outputs.sha }}
          path: maalc
          fetch-depth: 1
          sparse-checkout: |
            tests/screens
          sparse-checkout-cone-mode: false

      - name: Point the tests at it
        shell: bash
        run: |
          mkdir -p .local
          echo "$GITHUB_WORKSPACE/maalc" > .local/maalc_dir

      # conftest skips the screen tests when maalc_dir() fails; a bad pin must fail the run instead.
      - name: Check the screens arrived
        shell: bash
        run: test -n "$(ls maalc/tests/screens/*.png)"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # resource.lock.json names the package version (a tag of maalc-resource); the tool checks every file's sha256.
      - name: Fetch the resource package
        run: uv run python tools/fetch_resource.py

      - name: Fetch the OCR model
        run: uv run python tools/fetch_ocr.py

      - name: pytest
        run: uv run pytest -ra
